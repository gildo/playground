<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        h1 { font-size: 28px; margin-bottom: 8px; }
        p { color: #8892a4; margin-bottom: 40px; font-size: 15px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 800px;
        }
        .card {
            background: #16213e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
        }
        .card:hover {
            border-color: #e94560;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.15);
        }
        .card h2 { font-size: 18px; margin-bottom: 8px; }
        .card span { font-size: 13px; color: #8892a4; line-height: 1.5; }
    </style>
</head>
<body>
    <h1>Playground</h1>
    <p>A collection of web experiments.</p>
    <div class="grid">
        <a class="card" href="page-turner/">
            <h2>Page Turner</h2>
            <span>Bluetooth page turner for Kobo e-readers. Connect via Web Bluetooth and turn pages with volume buttons, swipe, or on-screen controls.</span>
        </a>
    </div>
</body>
</html>
