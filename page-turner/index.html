<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Page Turner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface2: #0f3460;
            --accent: #e94560;
            --accent-glow: rgba(233, 69, 96, 0.3);
            --text: #eee;
            --text-dim: #8892a4;
            --success: #4ecca3;
            --warning: #f0a500;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-dim);
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 8px rgba(78, 204, 163, 0.5);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding: 20px;
        }

        .connect-section {
            text-align: center;
        }

        .connect-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .connect-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px var(--accent-glow); }
        .connect-btn:active { transform: translateY(0); }
        .connect-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .connect-btn.connected {
            background: var(--surface2);
            box-shadow: 0 4px 20px rgba(15, 52, 96, 0.4);
        }

        .connect-btn svg { width: 20px; height: 20px; }

        .device-name {
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .page-controls {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 400px;
        }

        .page-btn {
            flex: 1;
            aspect-ratio: 1;
            max-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            background: var(--surface);
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .page-btn:hover { border-color: var(--accent); background: var(--surface2); }

        .page-btn:active {
            transform: scale(0.96);
            background: var(--surface2);
            border-color: var(--accent);
            box-shadow: inset 0 0 30px rgba(233, 69, 96, 0.1);
        }

        .page-btn.flash {
            border-color: var(--accent);
            background: var(--surface2);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .page-btn svg { width: 36px; height: 36px; opacity: 0.9; }
        .page-btn span { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        .key-config {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border-radius: 16px;
            overflow: hidden;
        }

        .key-config-header {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .key-config-header svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s;
        }

        .key-config.open .key-config-header svg { transform: rotate(180deg); }
        .key-config-body { display: none; padding: 0 16px 16px; }
        .key-config.open .key-config-body { display: block; }

        .key-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .key-option:last-child { border-bottom: none; }

        .key-label {
            font-size: 13px;
            color: var(--text-dim);
        }

        .key-select {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
        }

        .key-select:focus { border-color: var(--accent); }

        .log-section {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border-radius: 16px;
            overflow: hidden;
        }

        .log-header {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .log-header svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s;
        }

        .log-section.open .log-header svg { transform: rotate(180deg); }
        .log-body { display: none; padding: 0 16px 12px; }
        .log-section.open .log-body { display: block; }

        #log {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
            color: var(--text-dim);
            max-height: 150px;
            overflow-y: auto;
            line-height: 1.6;
        }

        #log .entry { padding: 2px 0; }
        #log .info { color: var(--text-dim); }
        #log .success { color: var(--success); }
        #log .error { color: var(--accent); }
        #log .warn { color: var(--warning); }

        .hint {
            text-align: center;
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.6;
            max-width: 320px;
            padding: 0 20px;
        }

        .hint kbd {
            display: inline-block;
            padding: 1px 6px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
        }

        .swipe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
        }

        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .swipe-indicator.left { left: 0; }
        .swipe-indicator.right { right: 0; }

        .swipe-indicator.active {
            opacity: 1;
        }

        .swipe-indicator svg {
            width: 32px;
            height: 32px;
            color: var(--accent);
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        @media (max-height: 600px) {
            .main { gap: 12px; padding: 10px 20px; }
            .page-btn { max-height: 140px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Page Turner</h1>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </header>

    <div class="main">
        <div class="connect-section">
            <button class="connect-btn" id="connectBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
                </svg>
                <span id="connectLabel">Connect</span>
            </button>
            <div class="device-name" id="deviceName"></div>
        </div>

        <div class="page-controls">
            <button class="page-btn" id="prevBtn" aria-label="Previous page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                <span>Prev</span>
            </button>
            <button class="page-btn" id="nextBtn" aria-label="Next page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 6 15 12 9 18"/>
                </svg>
                <span>Next</span>
            </button>
        </div>

        <div class="hint">
            Press <kbd>Vol+</kbd> for next page, <kbd>Vol-</kbd> for previous page.
            You can also swipe left/right or use arrow keys.
        </div>

        <div class="key-config" id="keyConfig">
            <div class="key-config-header" id="keyConfigToggle">
                <span>Key Mapping</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="key-config-body">
                <div class="key-option">
                    <span class="key-label">Next Page sends</span>
                    <select class="key-select" id="nextKeySelect">
                        <option value="right">Right Arrow</option>
                        <option value="pagedown">Page Down</option>
                        <option value="space">Space</option>
                        <option value="down">Down Arrow</option>
                    </select>
                </div>
                <div class="key-option">
                    <span class="key-label">Prev Page sends</span>
                    <select class="key-select" id="prevKeySelect">
                        <option value="left">Left Arrow</option>
                        <option value="pageup">Page Up</option>
                        <option value="up">Up Arrow</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="log-section" id="logSection">
            <div class="log-header" id="logToggle">
                <span>Connection Log</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="log-body">
                <div id="log"></div>
            </div>
        </div>
    </div>

    <div class="swipe-overlay">
        <div class="swipe-indicator left" id="swipeLeft">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        <div class="swipe-indicator right" id="swipeRight">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>
        </div>
    </div>

    <script>
    (() => {
        'use strict';

        // --- HID Keyboard scan codes ---
        const SCAN_CODES = {
            right:    0x4F,
            left:     0x50,
            down:     0x51,
            up:       0x52,
            pagedown: 0x4E,
            pageup:   0x4B,
            space:    0x2C,
        };

        // --- BLE Service / Characteristic UUIDs ---
        const HID_SERVICE          = 0x1812;
        const HID_REPORT_CHAR      = '00002a4d-0000-1000-8000-00805f9b34fb';
        const HID_REPORT_MAP_CHAR  = '00002a4b-0000-1000-8000-00805f9b34fb';
        const HID_CONTROL_CHAR     = '00002a4c-0000-1000-8000-00805f9b34fb';

        // Nordic UART fallback
        const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_RX_CHAR = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        // --- State ---
        let bleDevice = null;
        let bleServer = null;
        let reportCharacteristic = null;
        let uartTxCharacteristic = null;
        let writableCharacteristics = [];
        let isConnected = false;

        // --- DOM ---
        const connectBtn     = document.getElementById('connectBtn');
        const connectLabel   = document.getElementById('connectLabel');
        const statusDot      = document.getElementById('statusDot');
        const statusText     = document.getElementById('statusText');
        const deviceNameEl   = document.getElementById('deviceName');
        const prevBtn        = document.getElementById('prevBtn');
        const nextBtn        = document.getElementById('nextBtn');
        const logEl          = document.getElementById('log');
        const nextKeySelect  = document.getElementById('nextKeySelect');
        const prevKeySelect  = document.getElementById('prevKeySelect');
        const keyConfigToggle = document.getElementById('keyConfigToggle');
        const keyConfig      = document.getElementById('keyConfig');
        const logToggle      = document.getElementById('logToggle');
        const logSection     = document.getElementById('logSection');
        const swipeLeftEl    = document.getElementById('swipeLeft');
        const swipeRightEl   = document.getElementById('swipeRight');

        // --- Logging ---
        function log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `entry ${type}`;
            entry.textContent = `${new Date().toLocaleTimeString()} ${msg}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // --- UI Updates ---
        function setConnected(connected, name = '') {
            isConnected = connected;
            statusDot.classList.toggle('connected', connected);
            statusText.textContent = connected ? 'Connected' : 'Disconnected';
            connectLabel.textContent = connected ? 'Disconnect' : 'Connect';
            connectBtn.classList.toggle('connected', connected);
            deviceNameEl.textContent = name;
        }

        function flashButton(btn) {
            btn.classList.add('flash');
            if (navigator.vibrate) navigator.vibrate(30);
            setTimeout(() => btn.classList.remove('flash'), 200);
        }

        // --- Toggle panels ---
        keyConfigToggle.addEventListener('click', () => keyConfig.classList.toggle('open'));
        logToggle.addEventListener('click', () => logSection.classList.toggle('open'));

        // --- BLE Connection ---
        async function connect() {
            if (!navigator.bluetooth) {
                log('Web Bluetooth not supported in this browser', 'error');
                alert('Web Bluetooth API is not supported.\nUse Chrome or Edge on Android/Desktop.');
                return;
            }

            try {
                log('Scanning for BLE devices...');
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [
                        { services: [HID_SERVICE] },
                        { services: [UART_SERVICE] },
                        { services: ['battery_service'] },
                        { services: ['generic_access'] },
                        { namePrefix: 'Kobo' },
                        { namePrefix: 'kobo' },
                    ],
                    optionalServices: [
                        HID_SERVICE,
                        UART_SERVICE,
                        'battery_service',
                        'device_information',
                        'generic_access',
                    ]
                });

                const name = bleDevice.name || 'Unknown Device';
                log(`Selected: ${name}`, 'success');

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                log('Connecting GATT...');
                bleServer = await bleDevice.gatt.connect();
                log('GATT connected', 'success');

                await discoverServices();
                setConnected(true, name);

            } catch (err) {
                if (err.name === 'NotFoundError') {
                    log('No device selected', 'warn');
                } else {
                    log(`Connection error: ${err.message}`, 'error');
                }
            }
        }

        async function disconnect() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
            onDisconnected();
        }

        function onDisconnected() {
            log('Disconnected', 'warn');
            reportCharacteristic = null;
            uartTxCharacteristic = null;
            writableCharacteristics = [];
            bleServer = null;
            setConnected(false);
        }

        async function discoverServices() {
            if (!bleServer) return;
            reportCharacteristic = null;
            uartTxCharacteristic = null;
            writableCharacteristics = [];

            let services;
            try {
                services = await bleServer.getPrimaryServices();
            } catch (e) {
                log(`Service discovery failed: ${e.message}`, 'error');
                return;
            }

            log(`Found ${services.length} service(s)`);

            for (const service of services) {
                const uuid = service.uuid;
                const shortUuid = uuid.length > 8 ? uuid.slice(4, 8).toUpperCase() : uuid;
                log(`  Service: 0x${shortUuid}`);

                let chars;
                try {
                    chars = await service.getCharacteristics();
                } catch (e) {
                    log(`  Could not read characteristics: ${e.message}`, 'warn');
                    continue;
                }

                for (const char of chars) {
                    const props = char.properties;
                    const charShort = char.uuid.length > 8 ? char.uuid.slice(4, 8).toUpperCase() : char.uuid;
                    const propList = [];
                    if (props.read) propList.push('R');
                    if (props.write) propList.push('W');
                    if (props.writeWithoutResponse) propList.push('Wn');
                    if (props.notify) propList.push('N');
                    log(`    Char 0x${charShort} [${propList.join(',')}]`);

                    // Check for HID Report
                    if (char.uuid === HID_REPORT_CHAR && (props.write || props.writeWithoutResponse)) {
                        reportCharacteristic = char;
                        log('    -> HID Report (writable)', 'success');
                    }

                    // Check for UART TX
                    if (char.uuid === UART_TX_CHAR && (props.write || props.writeWithoutResponse)) {
                        uartTxCharacteristic = char;
                        log('    -> UART TX (writable)', 'success');
                    }

                    // Collect all writable characteristics as fallback
                    if (props.write || props.writeWithoutResponse) {
                        writableCharacteristics.push(char);
                    }
                }
            }

            if (reportCharacteristic) {
                log('Using HID Report for page turns', 'success');
            } else if (uartTxCharacteristic) {
                log('Using UART TX for page turns', 'success');
            } else if (writableCharacteristics.length > 0) {
                log(`No HID/UART found. ${writableCharacteristics.length} writable char(s) available`, 'warn');
            } else {
                log('No writable characteristics found. UI-only mode.', 'warn');
            }
        }

        // --- Send Page Turn ---
        async function sendPageTurn(direction) {
            const keySelect = direction === 'next' ? nextKeySelect : prevKeySelect;
            const scanCode = SCAN_CODES[keySelect.value];

            if (reportCharacteristic) {
                try {
                    // Standard HID keyboard report: [modifier, reserved, key1..key6]
                    const press = new Uint8Array([0x00, 0x00, scanCode, 0, 0, 0, 0, 0]);
                    const release = new Uint8Array([0x00, 0x00, 0, 0, 0, 0, 0, 0]);

                    if (reportCharacteristic.properties.writeWithoutResponse) {
                        await reportCharacteristic.writeValueWithoutResponse(press);
                        await new Promise(r => setTimeout(r, 50));
                        await reportCharacteristic.writeValueWithoutResponse(release);
                    } else {
                        await reportCharacteristic.writeValueWithResponse(press);
                        await new Promise(r => setTimeout(r, 50));
                        await reportCharacteristic.writeValueWithResponse(release);
                    }
                    log(`Sent HID ${direction} (0x${scanCode.toString(16)})`, 'success');
                    return;
                } catch (err) {
                    log(`HID write failed: ${err.message}`, 'error');
                }
            }

            if (uartTxCharacteristic) {
                try {
                    const cmd = direction === 'next' ? 'PAGE_NEXT\n' : 'PAGE_PREV\n';
                    const encoder = new TextEncoder();
                    const data = encoder.encode(cmd);

                    if (uartTxCharacteristic.properties.writeWithoutResponse) {
                        await uartTxCharacteristic.writeValueWithoutResponse(data);
                    } else {
                        await uartTxCharacteristic.writeValueWithResponse(data);
                    }
                    log(`Sent UART: ${cmd.trim()}`, 'success');
                    return;
                } catch (err) {
                    log(`UART write failed: ${err.message}`, 'error');
                }
            }

            if (writableCharacteristics.length > 0) {
                const char = writableCharacteristics[0];
                try {
                    const data = new Uint8Array([direction === 'next' ? 0x01 : 0x02]);
                    if (char.properties.writeWithoutResponse) {
                        await char.writeValueWithoutResponse(data);
                    } else {
                        await char.writeValueWithResponse(data);
                    }
                    log(`Sent ${direction} to fallback char`, 'success');
                    return;
                } catch (err) {
                    log(`Fallback write failed: ${err.message}`, 'error');
                }
            }

            if (!isConnected) {
                log(`${direction} (no BLE connection)`, 'info');
            }
        }

        // --- Page Turn Actions ---
        function pagePrev() {
            flashButton(prevBtn);
            sendPageTurn('prev');
        }

        function pageNext() {
            flashButton(nextBtn);
            sendPageTurn('next');
        }

        // --- Button Handlers ---
        connectBtn.addEventListener('click', () => {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        });

        prevBtn.addEventListener('click', pagePrev);
        nextBtn.addEventListener('click', pageNext);

        // --- Volume Buttons & Keyboard ---
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'AudioVolumeUp':
                case 'VolumeUp':
                    e.preventDefault();
                    pageNext();
                    break;
                case 'AudioVolumeDown':
                case 'VolumeDown':
                    e.preventDefault();
                    pagePrev();
                    break;
                case 'ArrowRight':
                case 'PageDown':
                    e.preventDefault();
                    pageNext();
                    break;
                case 'ArrowLeft':
                case 'PageUp':
                    e.preventDefault();
                    pagePrev();
                    break;
            }
        });

        // --- Swipe Gestures ---
        let touchStartX = 0;
        let touchStartY = 0;
        let swiping = false;

        document.addEventListener('touchstart', (e) => {
            // Don't capture swipes on interactive elements
            if (e.target.closest('button, select, .key-config, .log-section')) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            swiping = true;
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!swiping) return;
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;

            if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) {
                    swipeRightEl.classList.add('active');
                    swipeLeftEl.classList.remove('active');
                } else {
                    swipeLeftEl.classList.add('active');
                    swipeRightEl.classList.remove('active');
                }
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (!swiping) return;
            swiping = false;
            swipeLeftEl.classList.remove('active');
            swipeRightEl.classList.remove('active');

            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                if (dx > 0) {
                    pagePrev();  // Swipe right = previous page
                } else {
                    pageNext();  // Swipe left = next page
                }
            }
        }, { passive: true });

        // --- Persist key mapping ---
        function loadSettings() {
            try {
                const saved = JSON.parse(localStorage.getItem('pageTurnerSettings'));
                if (saved) {
                    if (saved.nextKey) nextKeySelect.value = saved.nextKey;
                    if (saved.prevKey) prevKeySelect.value = saved.prevKey;
                }
            } catch {}
        }

        function saveSettings() {
            localStorage.setItem('pageTurnerSettings', JSON.stringify({
                nextKey: nextKeySelect.value,
                prevKey: prevKeySelect.value,
            }));
        }

        nextKeySelect.addEventListener('change', saveSettings);
        prevKeySelect.addEventListener('change', saveSettings);
        loadSettings();

        // --- Prevent default volume on Android Chrome ---
        document.addEventListener('volumeupbutton', (e) => { e.preventDefault(); pageNext(); }, false);
        document.addEventListener('volumedownbutton', (e) => { e.preventDefault(); pagePrev(); }, false);

        log('Page Turner ready');
        log('Tap Connect to pair a BLE device');
    })();
    </script>
</body>
</html>
